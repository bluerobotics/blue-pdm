# Render Blueprint for BluePLM API
# https://render.com/docs/blueprint-spec
#
# Keep the build and start commands in step with api/Dockerfile and
# api/railway.json. All three deploy the same thing and have to agree:
# install from api/'s own lockfile, compile ahead of time, run the emitted
# JavaScript. Nothing is fetched from the npm registry when the service starts.

services:
  - type: web
    name: blueplm-api
    runtime: node
    # api/ is a separate deployable with its own package.json and lockfile. A
    # root `npm install` does not install it, so the API's dependencies have to
    # be installed with --prefix api or the service starts with nothing to run.
    buildCommand: npm ci --prefix api && npm run build --prefix api
    # --enable-source-maps makes stack traces point at the TypeScript sources.
    startCommand: node --enable-source-maps api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        # Match the Dockerfile and CI rather than inheriting whatever default
        # the platform happens to have when the service is created.
        value: "22"
      - key: SUPABASE_URL
        sync: false # User must set this
      - key: SUPABASE_KEY
        sync: false # User must set this (anon key)
      - key: SUPABASE_SERVICE_KEY
        sync: false # User must set this (service role key - required for invites)
      - key: EXTENSION_ENCRYPTION_KEY
        # User must set this. Encrypts integration credentials and extension
        # secrets at rest. Generate with:
        #   node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
        # WARNING: once set, this value can never change. Every secret encrypted
        # with it becomes permanently unreadable if it does.
        sync: false
      # CORS_ORIGINS is deliberately absent.
      #
      # It used to be "*", which really did let any website read this API's
      # responses. It is not replaced by a narrower list because most
      # deployments need no list at all: the desktop app is always allowed,
      # and server-to-server callers such as Odoo send no Origin header and
      # are not subject to CORS in the first place. Add it here only if a
      # browser application other than BluePLM calls this API, as a
      # comma-separated list of exact origins. Setting it adds to the
      # allowlist and cannot lock the desktop app out.
      - key: RATE_LIMIT_MAX
        value: "100"
      # Serves the Swagger UI and the OpenAPI document at /docs. On by default;
      # set to "false" to keep the API's shape off the public internet. This is
      # a documentation choice and affects nothing else - error responses never
      # carry internals either way.
      - key: ENABLE_DOCS
        value: "true"
      # Only decides developer conveniences now: log format and level, and
      # whether the Vite dev server is an allowed origin. It is stated here
      # rather than left to the default so that reading this file tells you
      # what the service is running as.
      - key: NODE_ENV
        value: production
