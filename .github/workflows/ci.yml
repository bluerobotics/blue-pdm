name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The repository default token is write-scoped and can approve pull requests, while every job here
# runs `npm ci` and therefore arbitrary postinstall scripts from the dependency tree. Nothing in
# this workflow writes anything back, so read is all it gets. Declared at the top level so a job
# added later inherits the restriction rather than the default.
permissions:
  contents: read

# A superseded push to a pull request has nothing left to prove, so cancel it.
# Pushes to main are never cancelled: every commit on main gets its own answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Defined in verify.yml so that tag builds run this exact job rather than a copy of it.
  # See the comment at the top of that file.
  verify:
    uses: ./.github/workflows/verify.yml

  # Non-blocking on purpose. `npm run lint` is red with a backlog of pre-existing errors, and a
  # blocking lint job would fail on its first run and be switched off before anyone fixed them.
  # This reports the count so it can be driven down, and starts blocking once it reaches zero.
  #
  # No count is quoted here deliberately. The figures this comment used to carry had gone stale —
  # the warning total by 7, measured against a clean checkout — and a comment nobody can trust is
  # worse than no comment. The job's own output is the current number; a ratchet is the thing that
  # should hold it, not a sentence.
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
